# Install with:
#     uv run pre-commit install --install-hooks
#
# CI runs ruff directly instead of through these hooks, so that lint findings
# arrive as inline annotations on the diff. It runs the hooks below with
# SKIP=ruff-check,ruff-format to cover the file-hygiene checks, which have no
# other enforcement point. Keep the two in step when adding a hook.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Local hooks rather than astral-sh/ruff-pre-commit, so that exactly one
  # ruff version exists: the one in uv.lock, shared by hooks, CI and humans.
  # It also keeps ruff updates flowing through dependabot's uv ecosystem,
  # which has no pre-commit equivalent.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        # --force-exclude makes ruff honour its own exclude settings even
        # though pre-commit passes explicit filenames.
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
