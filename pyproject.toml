[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ddgl"
dynamic = ["version"]
description = "Terminal-based GitLab client with TUI support"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Pierre-Louis Veyrenc", email = "pierrelouis.veyrenc@datadoghq.com" },
]
keywords = ["gitlab", "tui", "cli", "devops", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.3.3",
    "httpx>=0.27",
    "msgspec>=0.19",
    "tomli_w>=1.2.0",
    "platformdirs>=4.0",
    "rich>=15.0.0",
    "rich-click>=1.8",
    "textual>=1.0",
]

[project.urls]
Repository = "https://github.com/DataDog/ddgl-cli"
Issues = "https://github.com/DataDog/ddgl-cli/issues"

[project.scripts]
ddgl = "ddgl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ddgl"]

[tool.hatch.build.targets.sdist]
include = ["src/", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP047"]
