name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request pushes are worth cancelling; main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail rather than proceed when uv.lock has drifted from pyproject.toml.
  UV_LOCKED: "1"

jobs:
  # lint, test and build declare no `needs:` so they start concurrently.
  # The steps live in composite actions under .github/actions so release.yml
  # can hold a release to the same checks.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # Local actions resolve from the workspace, so the repository must be
      # on disk before `uses: ./.github/actions/...`.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        uses: ./.github/actions/lint

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep the matrix in step with release.yml.
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      # Local actions resolve from the workspace, so the repository must be
      # on disk before `uses: ./.github/actions/...`.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        uses: ./.github/actions/test
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}

  coverage:
    name: Coverage
    # The only job with a dependency: it aggregates what the matrix produced.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history so the coverage comment can diff against the base branch.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Combine and report coverage
        uses: ./.github/actions/coverage-report

      - name: Comment coverage on the pull request
        # On main this action wants to persist a badge to a dedicated branch.
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # hatch-vcs derives the version from `git describe`; a shallow clone
      # yields a bogus version without failing.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Shared with release.yml, which builds at the release tag with the
      # same checks. See .github/actions/build.
      - name: Build distributions
        uses: ./.github/actions/build
