name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request pushes are worth cancelling; main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `uv run` provisions the environment from uv.lock on first use, so no
  # explicit sync step is needed. UV_LOCKED makes it refuse to run at all if
  # uv.lock has drifted from pyproject.toml, which is the check an explicit
  # `uv sync --locked` would otherwise provide.
  UV_LOCKED: "1"

jobs:
  # lint, test and build are mutually independent and intentionally carry no
  # `needs:`, so all six runners start at once. Each job's `if:` blocks fork
  # pull requests outright; GitHub has no workflow-level equivalent, so the
  # condition is repeated rather than centralised in a gate job that would
  # serialise everything behind it.
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          # lint, build and the ubuntu/3.12 test leg run concurrently on the
          # same OS and Python, so they derive an identical cache key and race
          # to save it. Scoping per job keeps each save uncontended.
          cache-suffix: ${{ github.job }}

      # Called directly rather than through pre-commit: --output-format=github
      # turns findings into inline annotations on the diff, and these
      # invocations are read-only where the hooks rewrite files.
      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check --diff .

      - name: Restore the pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Only the file-hygiene hooks. The ruff hooks are covered above with
      # better output and without rewriting files, and testmon would select a
      # subset where the test job already runs everything on every OS. Also
      # catches anything committed with --no-verify.
      - name: Run the file-hygiene hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,testmon

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Run tests
        run: uv run pytest -v --cov --cov-report=

      # Renamed per leg so `coverage combine` in the coverage job sees four
      # distinct data files rather than four artifacts all called .coverage.
      - name: Name the coverage data for this leg
        run: mv .coverage ".coverage.${{ matrix.os }}-${{ matrix.python-version }}"

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          # Coverage data files are dotfiles, which this action skips by default.
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage
    # The only job with a dependency: it aggregates what the matrix produced.
    needs: test
    # Skipping `test` would skip this job anyway, but this job is the one
    # holding pull-requests: write, so the fork policy is stated explicitly
    # here rather than inherited from `needs:`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history so the comment action can diff against the base branch.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Download coverage data from every matrix leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true

      # Combining all four legs matters because shell.py, git.py and the
      # platformdirs paths differ per OS; gating on Linux alone would fail the
      # build over lines that macOS does cover.
      - name: Combine coverage data
        run: uv run coverage combine

      - name: Report coverage and enforce the floor
        run: uv run coverage report

      - name: Comment coverage on the pull request
        # Skipped on pushes to main, where this action would otherwise want to
        # persist a badge to a dedicated branch.
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # hatch-vcs derives the version from `git describe`, which needs the tag
      # history. A shallow clone yields a bogus version without failing.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      # Installs the artifact we just built into a throwaway environment, so a
      # broken console script or unreadable version metadata fails here rather
      # than after publishing.
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          uv run --isolated --no-project --with "${wheel}" ddgl --version

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
