name: Coverage report
description: >-
  Combines the coverage data uploaded by every test leg and enforces the
  floor configured in pyproject.toml. Shared by ci.yml and release.yml; the
  pull request comment stays in ci.yml, which is the only place it can post.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.12"
        enable-cache: true
        cache-suffix: coverage

    - name: Download coverage data from every matrix leg
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: coverage-data-*
        merge-multiple: true

    # All legs, because shell.py and git.py execute different code per OS.
    - name: Combine coverage data
      run: uv run coverage combine
      shell: bash

    - name: Report coverage and enforce the floor
      run: uv run coverage report
      shell: bash
